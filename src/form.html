<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            background-color: black;
            
        }
        div {
            max-width: 500px;
            max-height: 500px;
            padding: 10px;
            background-color: rgb(104, 9, 106);
            color: aliceblue;
            text-align: center;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: rgb(15, 129, 68);
            color: white;
            border-radius: 2px;
        }
        input{
            margin-top: 10px;
            padding: 10px 20px;
            border-radius: 2px;
            border: none;
            background-color: rgb(14, 56, 93);
            color: white;
            cursor: pointer;
        }
        textarea {
            margin-top: 10px;
            padding: 10px 20px;
            border-radius: 2px;
            border: none;
            background-color: rgb(14, 56, 93);
            color: white;
            cursor: pointer;
            resize: vertical;
        }

    </style>
</head>
<body>
    <div>
        <form action="/submit" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>
            <label for="mail">Email:</label>
            <input type="email" id="mail" name="email" required>
            <br><br>
            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
            <br><br>
            <button type="submit">Submit</button>
        </form>

    </div>
    
</body>
</html>
